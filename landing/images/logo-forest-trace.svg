<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Forest Trace AI</title>
  <defs>
    <linearGradient id="ltk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#063d33"/>
      <stop offset="100%" stop-color="#1a6b8c"/>
    </linearGradient>
    <linearGradient id="ltk2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a5c4a"/>
      <stop offset="100%" stop-color="#3db3a3"/>
    </linearGradient>
  </defs>
  <rect width="56" height="56" rx="14" fill="url(#ltk)" opacity="0.12"/>
  <!-- Anillos de trazabilidad -->
  <circle cx="24" cy="28" r="16" stroke="url(#ltk)" stroke-width="2" fill="none" opacity="0.4"/>
  <circle cx="24" cy="28" r="10" stroke="url(#ltk)" stroke-width="1.8" fill="none" opacity="0.65"/>
  <circle cx="24" cy="28" r="4.5" fill="url(#ltk2)"/>
  <!-- Senda hacia el punto de exportación -->
  <path
    d="M 36 14 C 46 18 48 28 40 36"
    stroke="url(#ltk)"
    stroke-width="2.2"
    stroke-linecap="round"
    fill="none"
  />
  <circle cx="40" cy="36" r="3.5" fill="#c9a227" stroke="#fff" stroke-width="1"/>
</svg>
