name: Deploy landing to Vercel

on:
  push:
    branches:
      - main
    paths:
      - "landing/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (production)
        working-directory: landing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Slug del equipo (URL: vercel.com/<slug>/…). Opcional si solo tienes cuenta personal sin equipo.
          VERCEL_TEAM: ${{ secrets.VERCEL_TEAM }}
          # Nombre del proyecto en el dashboard; por defecto coincide con el subdominio .vercel.app
          VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}
        run: |
          set -e
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN no está definido (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi
          PROJECT_NAME="${VERCEL_PROJECT_NAME:-landing-five-teal-76}"
          rm -rf .vercel
          if [ -n "$VERCEL_TEAM" ]; then
            vercel link --yes --non-interactive --team "$VERCEL_TEAM" --project "$PROJECT_NAME"
          else
            vercel link --yes --non-interactive --project "$PROJECT_NAME"
          fi
          vercel deploy --prod --yes
