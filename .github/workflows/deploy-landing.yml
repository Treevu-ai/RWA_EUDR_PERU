name: Deploy landing to Vercel

on:
  push:
    branches:
      - main
    paths:
      - "landing/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (production)
        working-directory: landing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_hvdUkmghXOiSlTAs1fTOD4u4
          VERCEL_PROJECT_ID: prj_J3BWCGq6ihxAPS2CDqBTDtaOgNFo
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN no está definido en GitHub (Settings → Secrets and variables → Actions). Sin él el CLI no puede desplegar y producción se queda en un HTML antiguo."
            exit 1
          fi
          vercel deploy --prod --yes
